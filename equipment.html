
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Management | LabTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-roles="admin,researcher,laboratory_personnel,supervisor">

<div class="dashboard-container">

    <aside class="sidebar">
        <h2>LabTrack</h2>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="experiments.html">Experiments</a>
            <a href="observations.html">Observations</a>
            <a href="equipment.html" class="active">Equipment</a>
            <a href="materials.html">Materials</a>
            <a href="reports.html">Reports</a>
            <a href="activity.html">Activity History</a>
            <a href="settings.html">Settings</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Equipment Management</h1>
        <p>Register and manage laboratory equipment.</p>

        <section class="auth-box">
            <h2>Add New Equipment</h2>

            <form id="equipmentForm">
                <label>Equipment Name</label>
                <input type="text" id="equipmentName"
                    placeholder="Enter equipment name" required>

                <label>Description</label>
                <textarea id="equipmentDescription"
                    placeholder="Enter equipment description"></textarea>

                <label>Availability Status</label>
                <select id="equipmentStatus" required>
                    <option value="available">Available</option>
                    <option value="in_use">In Use</option>
                    <option value="maintenance">Under Maintenance</option>
                </select>

                <button type="submit">Add Equipment</button>
                <p id="equipmentMessage"></p>
            </form>
        </section>

        <section class="auth-box">
            <h2>Registered Equipment</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="equipmentTable">
                    <tr><td colspan="4">Loading equipment...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
