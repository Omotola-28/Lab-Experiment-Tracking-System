
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | LabTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-roles="admin,researcher,laboratory_personnel,supervisor">

<div class="dashboard-container">
    <aside class="sidebar">
        <h2>LabTrack</h2>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="experiments.html">Experiments</a>
            <a href="observations.html">Observations</a>
            <a href="equipment.html">Equipment</a>
            <a href="materials.html">Materials</a>
            <a href="reports.html" class="active">Reports</a>
            <a href="activity.html">Activity History</a>
            <a href="settings.html">Settings</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Laboratory Reports</h1>
        <p>View and print reports generated from laboratory records.</p>

        <section class="auth-box">
            <h2>Experiment Summary</h2>
            <div id="reportSummary">Loading report...</div>
            <button onclick="window.print()">Print Report</button>
            <button onclick="downloadExperimentReport()">Download CSV</button>
        </section>

        <section class="auth-box">
            <h2>Experiment Records</h2>
            <table>
                <thead>
                    <tr>
                        <th>Experiment</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="reportTable"></tbody>
            </table>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
