
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | LabTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-roles="admin,researcher,laboratory_personnel,supervisor">

<div class="dashboard-container">
    <aside class="sidebar">
        <h2>LabTrack</h2>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="experiments.html">Experiments</a>
            <a href="observations.html">Observations</a>
            <a href="equipment.html">Equipment</a>
            <a href="materials.html">Materials</a>
            <a href="reports.html">Reports</a>
            <a href="activity.html">Activity History</a>
            <a href="settings.html" class="active">Settings</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Account Settings</h1>
        <p>Manage your profile and account password.</p>

        <section class="auth-box">
            <h2>Profile Information</h2>

            <form id="profileForm">
                <label>Full Name</label>
                <input type="text" id="settingsName" required>

                <label>Email Address</label>
                <input type="email" id="settingsEmail" disabled>

                <label>Account Role</label>
                <input type="text" id="settingsRole" disabled>

                <button type="submit">Save Profile</button>
                <p id="profileMessage"></p>
            </form>
        </section>

        <section class="auth-box">
            <h2>Change Password</h2>

            <form id="passwordForm">
                <label>New Password</label>
                <input type="password" id="newPassword"
                    minlength="8" required>

                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword"
                    minlength="8" required>

                <button type="submit">Update Password</button>
                <p id="passwordMessage"></p>
            </form>
        </section>

        <section class="auth-box">
            <h2>Sign Out</h2>
            <p>Sign out of your LabTrack account on this device.</p>
            <button type="button" onclick="logout()">Logout</button>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
